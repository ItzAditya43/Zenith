<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Zenith Clipper</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #12151f;
      color: #dde1ea;
    }
    h1 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button {
      display: block;
      width: 100%;
      padding: 9px 10px;
      margin-bottom: 8px;
      border: 1px solid #2a2f3f;
      border-radius: 6px;
      background: #1a1e2b;
      color: #dde1ea;
      font-size: 12.5px;
      cursor: pointer;
      text-align: left;
    }
    button:hover {
      background: #232840;
      border-color: #4dd9c0;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #status {
      font-size: 11.5px;
      color: #8a90a6;
      margin-top: 6px;
      min-height: 14px;
      line-height: 1.4;
    }
    #status.error {
      color: #ff6f6f;
    }
    #status.ok {
      color: #4dd9c0;
    }
    .settings-row {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #232840;
    }
    .settings-row label {
      font-size: 10.5px;
      color: #8a90a6;
      display: block;
      margin-bottom: 4px;
    }
    .settings-row input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      background: #0e1119;
      border: 1px solid #2a2f3f;
      border-radius: 5px;
      color: #dde1ea;
      font-size: 11.5px;
    }
  </style>
</head>
<body>
  <h1>Zenith Clipper</h1>
  <button id="sendPage">Send this page</button>
  <button id="sendSelection">Send selected text</button>
  <div id="status"></div>
  <div class="settings-row">
    <label for="baseUrl">Zenith backend URL</label>
    <input id="baseUrl" placeholder="http://localhost:8420" />
  </div>
  <script src="popup.js"></script>
</body>
</html>
