[package]
name = "zenith"
version = "0.1.0"
description = "Zenith — self-hosted local AI chat for Ollama"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
# Lightweight, dependency-light cross-platform screen capture used by the
# user-initiated "Screenshot" button (ScreenshotButton.jsx). Deliberately NOT
# a full computer-use surface: read-only capture triggered by an explicit
# click, no synthetic input — see docs/NOT_BUILT.md for why that's excluded.
screenshots = "0.8"
base64 = "0.22"

[features]
# Bundling the frozen backend as a sidecar is on by default.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
