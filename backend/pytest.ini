[pytest]
# `pytest tests -q` / `pytest -q` runs everything (unchanged default).
# Fast, hermetic subset only: `pytest -m "not integration" -q`
markers =
    integration: needs a real external dependency (live Ollama, network, Chromium) — not run by default in fast/CI-lite mode, still included in the default full run.

testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
