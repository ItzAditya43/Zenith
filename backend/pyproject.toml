[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-backend"
version = "0.1.0"
description = "Local-first AI chat backend with a small router over local Ollama models."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
# Kept in lockstep with requirements.txt (the source of truth — that's what
# Docker/CI actually install). Everything here mirrors requirements.txt's
# production deps; see that file's comments for version-conflict history.
dependencies = [
    "fastapi==0.128.0",
    "starlette>=0.40.0,<0.51.0",
    "uvicorn[standard]==0.34.0",
    "mcp==1.28.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "fpdf2==2.8.8",
    "Pillow==11.1.0",
    "faster-whisper==1.1.1",
    "piper-tts==1.4.2",
    "pyttsx3==2.98",
    "aiofiles==24.1.0",
    "cryptography>=42.0.0",
    "python-magic==0.4.27",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "youtube-transcript-api==1.2.4",
    "sqlite-vec>=0.1.6",
    "requests>=2.31",
    "websockets>=12.0,<14.0",
    "prometheus-client==0.21.1",
]

[project.optional-dependencies]
# requirements-dev.txt is authoritative for the dev/test environment
# (includes -r requirements.txt plus pytest, ruff, mypy, pip-audit, etc.);
# this list is kept only for tools that resolve dev deps via pyproject.
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pip-audit",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 (line too long): the existing codebase has many long SQL/string
# literals; enforcing this would mean reformatting hundreds of pre-existing
# lines rather than catching real bugs. Left as a soft target via
# line-length above; not enforced as an error for this first pass.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["app/core", "app/db"]
ignore_missing_imports = true
disallow_untyped_defs = false
