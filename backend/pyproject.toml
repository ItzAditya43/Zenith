[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-backend"
version = "0.1.0"
description = "Local-first AI chat backend with a small router over local Ollama models."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-magic>=0.4.27",
    "numpy>=1.26",
    "sqlite-vec>=0.1.0",
    "ollama>=0.1.8",
    "faster-whisper>=1.0",
    "TTS>=0.22",
    "piper>=1.2",
    "structlog>=24.1",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]