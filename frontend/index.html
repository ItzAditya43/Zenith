<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <title>Zenith — local AI cockpit</title>

    <!-- PWA / mobile web-app: installable via Add to Home Screen, standalone
         display with the brand icon. Full Android install additionally needs
         a production build served over HTTPS (the service worker below only
         registers in a prod build — see main.jsx). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d1017" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zenith" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root">
      <!-- Boot splash: shown until React mounts and removes it, so first
           paint is the brand mark instead of a blank frame. -->
      <div id="boot-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d1017;z-index:9999;">
        <img src="/icon-192.png" width="56" height="56" style="border-radius:14px;animation:boot-pulse 1.4s ease-in-out infinite;" alt="" />
      </div>
      <style>
        @keyframes boot-pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
