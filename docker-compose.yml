# NOTE: This stack assumes Ollama is already running on the host
# (e.g. `ollama serve`) and reachable at host.docker.internal:11434.
# Running a second Ollama inside Docker collides on port 11434 with a
# native Ollama and makes the stack hang at startup. If you prefer a
# fully containerized Ollama, stop the host Ollama first and uncomment
# the `ollama` service + its `depends_on` block below.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zenith-backend
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - ZENITH_DATA_DIR=/data
      # Empty = use whatever is set in Settings / config.json.
      - AUTH_ENABLED=${AUTH_ENABLED:-}
      - AUTH_SHARED_SECRET=${AUTH_SHARED_SECRET:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
      # --- Network exposure ---
      # Ports are published on 127.0.0.1 only, so just this machine can reach
      # the stack. For phone/LAN access run with ZENITH_BIND=0.0.0.0 and set a
      # passcode in Settings -> Data: remote clients get 403 until a passcode
      # or shared secret exists (see app/core/security.py, MULTIDEVICE.md).
      # A browser on the host reaches the container via the Docker bridge
      # gateway, so that network counts as local — but only while the port
      # is published on loopback (ZENITH_HOST_BIND tells the backend which).
      - ZENITH_HOST_BIND=${ZENITH_BIND:-127.0.0.1}
      - ZENITH_TRUSTED_NETWORKS=172.16.0.0/12,192.168.65.0/24
      # Set by `docker compose --profile search up` users; empty = Settings value.
      - ZENITH_SEARXNG_URL=${ZENITH_SEARXNG_URL:-}
    ports:
      - "${ZENITH_BIND:-127.0.0.1}:8420:8420"
    volumes:
      - backend-data:/data
      # --- Agent tools (bash/file access), OFF by default ---
      # Zenith's agent mode (Settings -> Agent tools) runs shell commands
      # and reads/writes files wherever the backend process can see. With
      # only the line above, that's just this container's own throwaway
      # filesystem — the agent can `write_file` all day and never touch a
      # real file of yours. If you want it to actually operate on your
      # machine (edit a real project, read real notes), uncomment ONE of
      # the lines below. This is a deliberate, conscious choice — a local
      # model driving a shell against your home directory is real risk,
      # not a formality. Start with the scoped mount; only use the second
      # line if you've read Settings -> Agent tools and picked a mode you
      # trust (Manual/Semi-auto pause for your approval; Full-auto does
      # not).
      # - ${HOME}/zenith-workspace:/workspace       # scoped: one folder only (recommended)
      # - ${HOME}:/host-home                        # unrestricted: your whole home directory
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Headless chromium (browser_* agent tools) crashes under the default
    # 64MB /dev/shm — Chrome uses shared memory for tab rendering buffers.
    shm_size: "1gb"
    # Without a real PID 1, killed subprocesses' orphaned grandchildren
    # (chromium's crashpad handler, in particular — it detaches into its
    # own session and reparents to PID 1 on exit) become unreaped zombies.
    # `init: true` runs a proper init (tini) as PID 1 so they get reaped.
    init: true
    restart: unless-stopped
    # Neither curl nor wget is installed in the backend image (see
    # Dockerfile — only libmagic1/chromium/git), so the healthcheck shells
    # out to Python's stdlib instead of relying on either being present.
    # start_period is generous because faster-whisper/heavy imports and
    # model warm-up can take a few seconds on first boot.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8420/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Conservative-but-workable ceiling: faster-whisper + document processing
    # can spike memory during transcription/OCR jobs. Bump if you see OOM
    # kills under heavy use; this is a starting point, not a hard science.
    mem_limit: 4g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    # TODO: consider cap_drop (e.g. cap_drop: [ALL] + add back only what
    # bash-based agent tools and headless chromium actually need) once
    # agent-mode's capability requirements are audited. Chromium's sandbox
    # and the arbitrary shell commands agent mode can run make this risky
    # to guess at — read_only/cap_drop are deliberately NOT added here.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zenith-frontend
    environment:
      # By default the frontend derives the backend URL from whatever host it
      # was opened on (same hostname, port 8420) — so accessing the app from
      # another device on your LAN/Tailscale just works. Uncomment and pin this
      # only if your backend lives at a fixed, different address.
      # - VITE_API_BASE=http://localhost:8420
      - VITE_API_BASE=
    ports:
      - "${ZENITH_BIND:-127.0.0.1}:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # Small static/dev server; bumped a little above bare-minimum so the
    # Vite dev server + esbuild don't get starved. Starting point, adjust
    # if you build the production bundle instead (see Dockerfile CMD note).
    mem_limit: 512m
    cpus: 1
    security_opt:
      - no-new-privileges:true

  # Optional self-hosted web search (stabler than scraping DuckDuckGo):
  #   ZENITH_SEARXNG_URL=http://searxng:8080 docker compose --profile search up
  searxng:
    image: searxng/searxng:latest
    profiles: ["search"]
    container_name: zenith-searxng
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

volumes:
  backend-data:
