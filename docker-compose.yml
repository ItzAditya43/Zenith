services:
  ollama:
    image: ollama/ollama:latest
    container_name: cortex-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-backend
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - CORTEX_DATA_DIR=/data
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_SHARED_SECRET=${AUTH_SHARED_SECRET:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8420:8420"
    volumes:
      - backend-data:/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cortex-frontend
    environment:
      - VITE_API_BASE=http://localhost:8420
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama-data:
  backend-data: