# NOTE: This stack assumes Ollama is already running on the host
# (e.g. `ollama serve`) and reachable at host.docker.internal:11434.
# Running a second Ollama inside Docker collides on port 11434 with a
# native Ollama and makes the stack hang at startup. If you prefer a
# fully containerized Ollama, stop the host Ollama first and uncomment
# the `ollama` service + its `depends_on` block below.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-backend
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - CORTEX_DATA_DIR=/data
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_SHARED_SECRET=${AUTH_SHARED_SECRET:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8420:8420"
    volumes:
      - backend-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cortex-frontend
    environment:
      - VITE_API_BASE=http://localhost:8420
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
