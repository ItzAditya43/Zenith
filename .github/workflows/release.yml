name: Release

# Push a version tag (v0.10.0, ...) and this builds signed desktop installers
# for Windows, Linux and macOS, attaches them to a GitHub Release and
# publishes it, so it shows up under Releases and the in-app updater
# (which reads releases/latest/download/latest.json) can find it.
#
# Signing uses two repo secrets (see DESKTOP.md "Auto-update"):
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# macOS builds are not notarized (no Apple Developer ID yet): first launch
# needs right-click → Open.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.10.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    # The freeze once hung for 6 hours on Windows; fail fast instead.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libmagic1

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned freeze toolchain
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-freeze.txt

      - name: Freeze backend with PyInstaller
        working-directory: backend
        timeout-minutes: 40
        run: pyinstaller zenith-backend.spec --noconfirm

      - name: Smoke-test the frozen backend
        shell: bash
        timeout-minutes: 5
        run: |
          BIN=backend/dist/zenith-backend; [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          export ZENITH_DATA_DIR="$RUNNER_TEMP/zenith-smoke" ZENITH_PORT=8499
          "$BIN" > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -m 2 http://127.0.0.1:8499/api/rag/status > "$RUNNER_TEMP/rag.json"; then break; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/rag.json"; echo
          grep -q '"vector_extension": *true' "$RUNNER_TEMP/rag.json" || { echo "sqlite-vec missing from the frozen build"; tail -50 "$RUNNER_TEMP/backend.log"; exit 1; }

      - name: Place backend sidecar
        shell: bash
        run: |
          triple=$(rustc -vV | grep '^host:' | cut -d' ' -f2)
          mkdir -p desktop/src-tauri/binaries
          if [ -f backend/dist/zenith-backend.exe ]; then
            cp backend/dist/zenith-backend.exe "desktop/src-tauri/binaries/zenith-backend-$triple.exe"
          else
            cp backend/dist/zenith-backend "desktop/src-tauri/binaries/zenith-backend-$triple"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ env.TAG }}
          releaseName: "Zenith ${{ env.TAG }}"
          releaseBody: |
            ## Install

            | Platform | Download |
            |---|---|
            | **Windows** | `Zenith_*_x64-setup.exe` (or the `.msi`) |
            | **Linux** | `.AppImage` (any distro: `chmod +x` and run) or `.deb` (Debian/Ubuntu) |
            | **macOS** (Apple silicon) | `.dmg` — not notarized yet: right-click → Open the first time |

            Zenith needs [Ollama](https://ollama.com) running on the same machine. On first launch it checks
            your hardware and suggests models that fit.

            What's new: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ env.TAG }}/CHANGELOG.md).
          # Built as a draft so a half-finished matrix never shows up as
          # "latest"; the publish job below flips it once assets exist.
          releaseDraft: true
          prerelease: false

  publish:
    needs: build
    # Publish whatever platforms succeeded; a single flaky runner shouldn't
    # block the others. Skipped only if the run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length' || echo 0)
          echo "assets: $assets"
          if [ "$assets" -gt 0 ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            echo "No installers were built — leaving the release as a draft."; exit 1
          fi
