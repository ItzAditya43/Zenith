name: Release

# Push a version tag (v0.10.0, ...) and this builds signed desktop installers
# for Windows, Linux and macOS, attaches them to a GitHub Release and
# publishes it, so it shows up under Releases and the in-app updater
# (which reads releases/latest/download/latest.json) can find it.
#
# Signing uses two repo secrets (see DESKTOP.md "Auto-update"):
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# macOS builds are not notarized (no Apple Developer ID yet): first launch
# needs right-click → Open.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.10.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    # The freeze once hung for 6 hours on Windows; fail fast instead.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Pinned: the `screenshots` crate (via dbus) fails to compile on Linux
      # with newer stable Rust (type-inference change, rust-lang/rust#148922).
      # 1.99.1 is the toolchain the last good Linux build used. Unpin after
      # moving off `screenshots`.
      - uses: dtolnay/rust-toolchain@1.99.1

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libmagic1

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm ci

      # actions/setup-python's macOS build lacks SQLite extension loading
      # (sqlite3.Connection.enable_load_extension), so the frozen app could
      # never load sqlite-vec. Homebrew's Python is built with it.
      - name: Use Homebrew Python for the macOS freeze
        if: runner.os == 'macOS'
        run: |
          brew install python@3.11
          "$(brew --prefix python@3.11)/bin/python3.11" -m venv "$RUNNER_TEMP/freeze-venv"
          echo "$RUNNER_TEMP/freeze-venv/bin" >> "$GITHUB_PATH"

      - name: Install pinned freeze toolchain
        working-directory: backend
        shell: bash
        run: |
          python -c "import sqlite3; sqlite3.connect(':memory:').enable_load_extension(True)" \
            || { echo "this Python can't load SQLite extensions — sqlite-vec would be missing"; exit 1; }
          python -m pip install --upgrade pip
          pip install -r requirements-freeze.txt

      - name: Freeze backend with PyInstaller
        shell: bash
        timeout-minutes: 50
        run: backend/scripts/freeze.sh

      - name: Smoke-test the frozen backend
        timeout-minutes: 5
        run: python backend/scripts/smoke_frozen.py

      - name: Place backend sidecar
        shell: bash
        run: |
          triple=$(rustc -vV | grep '^host:' | cut -d' ' -f2)
          mkdir -p desktop/src-tauri/binaries
          if [ -f backend/dist/zenith-backend.exe ]; then
            cp backend/dist/zenith-backend.exe "desktop/src-tauri/binaries/zenith-backend-$triple.exe"
          else
            cp backend/dist/zenith-backend "desktop/src-tauri/binaries/zenith-backend-$triple"
          fi

      # Windows code signing, only when a certificate is configured:
      # WINDOWS_CERTIFICATE (base64 .pfx) + WINDOWS_CERTIFICATE_PASSWORD.
      - name: Prepare Windows signing
        id: winsign
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$WINDOWS_CERTIFICATE" ]; then echo "args=" >> "$GITHUB_OUTPUT"; echo "No Windows certificate set; installers stay unsigned."; exit 0; fi
          echo "$WINDOWS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/codesign.pfx"
          cmd="signtool sign /f $(cygpath -w "$RUNNER_TEMP/codesign.pfx") /p $WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 %1"
          printf 'args=--config {"bundle":{"windows":{"signCommand":"%s"}}}\n' "${cmd//\\/\\\\}" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing + notarization: used by Tauri only when these secrets exist.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          tagName: ${{ env.TAG }}
          releaseName: "Zenith"
          args: ${{ steps.winsign.outputs.args }}
          releaseBody: |
            ## Install

            | Platform | Download |
            |---|---|
            | **Windows** | `Zenith_*_x64-setup.exe` (or the `.msi`) |
            | **Linux** | `.AppImage` (any distro: `chmod +x` and run) or `.deb` (Debian/Ubuntu) |
            | **macOS** (Apple silicon) | `.dmg` — not notarized yet: right-click → Open the first time |

            Zenith needs [Ollama](https://ollama.com) running on the same machine. On first launch it checks
            your hardware and suggests models that fit.

            What's new: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ env.TAG }}/CHANGELOG.md).
          # Built as a draft so a half-finished matrix never shows up as
          # "latest"; the publish job below flips it once assets exist.
          releaseDraft: true
          prerelease: false

  publish:
    needs: build
    # Publish whatever platforms succeeded; a single flaky runner shouldn't
    # block the others. Skipped only if the run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length' || echo 0)
          echo "assets: $assets"
          if [ "$assets" -gt 0 ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            echo "No installers were built — leaving the release as a draft."; exit 1
          fi

  # Prebuilt images on GHCR, so a Docker install is `docker compose pull`
  # instead of a build from source. Tagged with the version and `latest`.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          version="${TAG#v}"
          echo "backend=ghcr.io/$owner/zenith-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$owner/zenith-frontend" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.backend }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.frontend }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.frontend }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

