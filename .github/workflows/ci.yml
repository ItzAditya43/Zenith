name: CI

on:
  push:
    branches: [main, feature/full-audit-implementation, feature/full-audit-implementation-tmp]
  # Every PR, whatever its base — the default branch has been renamed before.
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests evals
      - name: Type check (mypy)
        run: mypy app
      - name: Dependency vulnerability scan (pip-audit)
        # Blocking. If an advisory has no fix yet, add a targeted
        # `--ignore-vuln <ID>` here with a comment, rather than going advisory-only.
        run: pip-audit -r requirements.txt
      - name: Pull sandbox test image
        # test_agent_sandbox.py's real-container tests skip without it.
        run: docker pull -q python:3.12-slim
      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=50

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Unit tests
        run: npx vitest run
      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build
        run: npm run build

  e2e:
    # Real browser + real backend, Ollama replaced by frontend/e2e/fake_ollama.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Install frontend + browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  desktop-windows:
    runs-on: windows-latest
    # A hung PyInstaller run once burned the full 6-hour limit.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install pinned freeze toolchain
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-freeze.txt
      - name: Freeze backend with PyInstaller
        shell: bash
        timeout-minutes: 50
        run: backend/scripts/freeze.sh
      - name: Place backend sidecar
        run: |
          $triple = (rustc -vV | Select-String "^host:").ToString().Split(" ")[1]
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          Copy-Item backend/dist/zenith-backend.exe "desktop/src-tauri/binaries/zenith-backend-$triple.exe"
      - name: Build Tauri app
        working-directory: desktop/src-tauri
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: zenith-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe